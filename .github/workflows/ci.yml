name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  backend:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds the built frontend at compile time.
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: brew install pkg-config
      # FFmpeg and the document tools come from pinned, checksummed sources;
      # the cache key changes whenever a pin or build step does.
      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/ffmpeg-build
            src-tauri/third-party/sources
          key: native-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/stage-document-tools.sh') }}
      # whisper-cli is built the same way, with its own key so a Whisper pin
      # change does not rebuild FFmpeg.
      - uses: actions/cache@v4
        with:
          path: src-tauri/whisper-build
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/build-whisper.sh') }}
      - name: Build the bundled helpers, FFmpeg, Whisper and document tools
        run: |
          sh scripts/build-vision-ocr.sh
          sh scripts/build-image-pdf.sh
          sh scripts/build-imageio.sh
          sh scripts/build-pdf.sh
          sh scripts/build-ffmpeg.sh
          sh scripts/stage-document-tools.sh
          sh scripts/build-whisper.sh
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
