[package]
name = "convertkit"
version = "0.1.0"
edition = "2021"

[lib]
name = "convertkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time", "macros"] }
tokio-util = "0.7"
which = "7"
infer = "0.16"
tempfile = "3"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
