[package]
name = "convertkit"
version = "0.1.0"
edition = "2021"

[lib]
name = "convertkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "macros"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
infer = "0.16"
tempfile = "3"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
img-parts = "0.4"
plist = "1"
lopdf = { version = "0.44", default-features = false }
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["aes256", "bzip2", "compress", "ppmd"] }
zeroize = "1"
